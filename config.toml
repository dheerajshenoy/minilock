[behavior]
ignore_empty_password = true
fail_delay_s = 2
daemonize = true # fork into the background once the screen is locked

# [pam]
# service = "login"

[image]
bgcolor = "#000000" # if image is not specified or not loaded, this color will be used as background color
path = "~/Downloads/9bc27292880429.5e569ff84e4d0.gif"
# path = "~/Gits/wallpapers/40.png"
smooth = true
tint = "#FF500044" # if image is specified and loaded, this color will be used as tint color on top of the image

[image.blur]
enable = true
radius = 4
iterations = 3
type = "kawase" # "box" or "gaussian" or "kawase" or "stack"

[indicator.keypress]
# "center", "top", "bottom", "left", "right", "top-left", "top-right",
# "bottom-left", "bottom-right", or "x:100,y:-40" (pixels; negative = from the
# far edge) / "x:25%,y:80%"; either axis may be left out
location = "bottom-left"
show = true
color = "#FF5000"
shape = "circle"
radius = 40
font = "Berkeley Mono"
state_text = false

[indicator.capslock]
show = true
location = "top-right"
color = "#FF5000"
shape = "circle"
radius = 10
